<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22314F"/>
      <stop offset="1" stop-color="#0C1424"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="os" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底座：深色横版徽章 -->
  <rect width="680" height="240" rx="48" fill="url(#bg)"/>
  <rect width="680" height="240" rx="48" fill="url(#glow)"/>

  <!-- 若隐若现的电路纹理 -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <path d="M636,44 L608,44 L608,72"/>
    <path d="M30,208 L30,180 L54,180"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.10">
    <circle cx="608" cy="76" r="3"/>
    <circle cx="58" cy="180" r="3"/>
  </g>

  <!-- 剑羚：放大 1.32 倍，居中于左侧图形区 -->
  <g transform="translate(130,118) scale(1.32) translate(-120,-106)">
    <!-- 耳 -->
    <polygon points="104,112 64,98 76,130" fill="#F59E0B"/>
    <polygon points="136,112 176,98 164,130" fill="#F59E0B"/>
    <polygon points="98,113 74,104 81,124" fill="#B45309"/>
    <polygon points="142,113 166,104 159,124" fill="#B45309"/>
    <!-- 长直双角 -->
    <polygon points="108,116 117,111 95,30 88,34" fill="url(#horn)"/>
    <polygon points="123,111 132,116 152,34 145,30" fill="url(#horn)"/>
    <!-- 面部双切面 -->
    <polygon points="103,108 137,108 145,138 131,178 120,187 109,178 95,138" fill="#F59E0B"/>
    <polygon points="103,108 120,112 120,187 109,178 95,138" fill="#FBBF24"/>
    <!-- 深色面部条纹 + 鼻吻 -->
    <g fill="#101828">
      <polygon points="105,110 113,112 110,150 104,146"/>
      <polygon points="135,110 127,112 130,150 136,146"/>
      <polygon points="111,166 129,166 120,186"/>
    </g>
  </g>

  <!-- 图形区与字标区分隔线 -->
  <line x1="266" y1="58" x2="266" y2="182" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- 字标：Oryx（近白） + OS（琥珀渐变，呼应角色） -->
  <text x="300" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="84" font-weight="700" letter-spacing="2"><tspan fill="#F8FAFC">Oryx</tspan><tspan fill="url(#os)">OS</tspan></text>
  <text x="303" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#FFFFFF" fill-opacity="0.5">AGENT HARNESS OS</text>
</svg>
