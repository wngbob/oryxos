# OryxOS 骨架配置（随 user story 落地逐步充实）
spring.application.name=oryxos
server.port=8080

# SQLite 数据源（.oryxos/ 工作区由 oryxos init 创建）
# 审计表（tool_invocations / llm_calls）实体已落地，但建表走手工脚本，见下方 ddl-auto 说明
spring.datasource.url=jdbc:sqlite:.oryxos/oryxos.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 无版本化 Dialect，显式指定避免启动期连接探测元数据
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# 表结构演进不依赖 ddl-auto（CLAUDE.md：SQLite ALTER TABLE 能力弱），手动脚本或 Flyway
spring.jpa.hibernate.ddl-auto=none
